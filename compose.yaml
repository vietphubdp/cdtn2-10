name: techshop-demo
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${TECHSHOP_PORT:-8080}:80"
    environment:
      APP_NAME: TechShop
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${SHOP_URL:-http://localhost:${TECHSHOP_PORT:-8080}}
      APP_LOCALE: vi
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: techshop
      DB_USERNAME: techshop
      DB_PASSWORD: ${TECHSHOP_DB_PASSWORD:-techshop_local_demo}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@techshop.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TechShop}
    volumes:
      - uploads:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: techshop
      MYSQL_USER: techshop
      MYSQL_PASSWORD: ${TECHSHOP_DB_PASSWORD:-techshop_local_demo}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql:
  uploads:
